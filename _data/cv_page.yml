interests: Machine learning for biomarker discovery and clinical decision support in systems medicine. I am interested in integrating heterogeneous molecular, clinical and literature data, including transcriptomic and multi-omics information, to identify predictive biomarkers and therapeutic targets, with an emphasis on interpretable models and calibrated, uncertainty-aware predictions that remain reliable under distribution shift.

