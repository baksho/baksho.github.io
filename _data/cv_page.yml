projects:
  - title: Interpretable Cancer Drug-Response Prediction
    tags: Precision Oncology, GNN, Multi-omics
    text: Built an interpretable deep-learning pipeline for cancer drug-response prediction, integrating Gene Ontology-guided neural networks with molecular graph-based drug representations. Implemented drug-aware gene gating, multimodal fusion, and pathway-level interpretability, with synthetic-data experiments and a GDSC2 data pipeline.
    url: https://github.com/baksho/OncoLens
  - title: Uncertainty Quantification in Neural Networks
    tags: Gaussian Processes, Distribution Shift
    text: Investigated uncertainty estimation in neural networks through the connection between finite-width neural networks and infinite-width Gaussian-process limits. Compared NNGPs, deep ensembles, MC dropout, and RBF Gaussian processes, examining their predictive uncertainty and behavior under distribution shift.
    url: https://github.com/baksho/infinite-width-uq
  - title: Covariate Shift Regularization using Kernel Methods
    tags: Gradient Descent, Distribution Shift
    text: Investigated how covariate shift affects model generalization and predictive reliability under distribution mismatch; evaluated importance-weighting and self-attention-based approaches for adapting to changing input distributions. Student project supervised by Prof. Dr. Nicole Mücke, graded 1.0.
    url: https://github.com/baksho/dist_shift_regularization
  - title: Binary AMR Prediction from pbp4 Gene using Transformers
    tags: DNABERT, Nucleotide Transformer, PEFT
    text: Benchmarked encoder-only pretrained transformer models for binary antimicrobial resistance prediction in Staphylococcus aureus against Cefoxitin using pbp4 gene sequences. Analyzed learned sequence representations and classification performance across architectures, with LoRA-based parameter-efficient fine-tuning to adapt pretrained biological sequence models. Seminar "Deep Learning in Molecular Biology", supervised by Prof. Dr. Alice C. McHardy.
    url: https://github.com/baksho/AMRxformer
  - title: Grokking and Normal Hyperbolicity of Interpolation Manifold
    tags: Grokking, PyTorch, Neural Networks
    text: Investigated a possible interpretation of the sharp generalization transition in grokking as a loss of normal hyperbolicity of the interpolation manifold. Experimental evaluation of the hypothesis through a singular-value-based diagnostic of the residual Jacobian. Accepted as a paper at the SKILL 2026 student conference of the German Informatics Society.
    url: https://github.com/baksho/grokking-normal-hyperbolicity
  - title: Continuous Optimization DAG Learning
    tags: Causal Discovery, DAG, Statistical Learning
    text: Audited continuous-optimization approaches to Directed Acyclic Graph learning, including NOTEARS/DAGMA, with emphasis on benchmark sensitivity, standardization and causal-structure recovery. Compared learned graph structures and explored a directed-to-undirected bridge on real protein-signaling data.
    url: https://github.com/baksho/DAGnostics

